<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="高専ロボコン2026 試合タイマー">
  <title>ROBOCON 2026 TIMER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="timer-screen" aria-label="ロボコンタイマー">
    <section class="clock-area" aria-live="off">
      <div class="clock" id="clock">0:00</div>
    </section>

    <nav class="controls" aria-label="タイマー操作">
      <button class="control" id="team-intro-btn" type="button">チーム紹介</button>
      <button class="control" id="setup-btn" type="button">セッティングタイム</button>
      <button class="control match-control" id="match-btn" type="button">試合</button>
      <button class="control settings-control" id="settings-btn" type="button" aria-label="設定">設定</button>
    </nav>
  </main>

  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-panel">
      <header class="settings-header">
        <h2 id="settings-title">設定</h2>
        <button class="close-settings" id="close-settings" type="button" aria-label="閉じる">×</button>
      </header>
      <div class="match-start-setting">
        <label for="match-start-time">試合開始時間調整</label>
        <input id="match-start-time" type="number" inputmode="numeric" min="-60" max="180" step="1" value="0">
        <span>秒</span>
      </div>
      <label class="volume-label" for="volume-control"><span>音量</span><output id="volume-value" for="volume-control">100%</output></label>
      <input id="volume-control" class="volume-control" type="range" min="0" max="500" step="1" value="100">
      <label class="bgm-setting" for="bgm-toggle">
        <span>BGM</span>
        <input id="bgm-toggle" type="checkbox">
        <span class="switch-track" aria-hidden="true"><span></span></span>
        <output id="bgm-value">OFF</output>
      </label>
      <label class="bgm-setting" for="bass-boost-toggle">
        <span>低音強化</span>
        <input id="bass-boost-toggle" type="checkbox">
        <span class="switch-track" aria-hidden="true"><span></span></span>
        <output id="bass-boost-value">OFF</output>
      </label>
      <div class="bass-amount-setting" id="bass-amount-setting" hidden>
        <label class="bass-amount-label" for="bass-amount-control"><span>強さ</span><output id="bass-amount-value" for="bass-amount-control">250%</output></label>
        <input id="bass-amount-control" class="bass-amount-control" type="range" min="100" max="500" step="1" value="250">
      </div>
    </div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
